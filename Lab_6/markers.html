<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Markers</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #111;
      }

      main {
        width: min(94vw, 980px);
        text-align: center;
      }

      section {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 28px;
        align-items: start;
      }

      article {
        background: #fff;
        border: 1px solid #ccc;
        padding: 18px;
      }

      img {
        width: 100%;
        max-width: 420px;
        background: #fff;
      }

      h1 {
        font-size: 28px;
        margin: 0 0 16px;
      }

      p {
        font-size: 18px;
        margin: 14px 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AR Markers</h1>
      <section>
        <article>
          <h2>Hiro Marker</h2>
          <img src="hiro-marker.png" alt="Hiro AR marker" />
          <p>Main lab exercises.</p>
        </article>
        <article>
          <h2>Kanji Marker</h2>
          <img src="kanji-marker.png" alt="Kanji AR marker" />
          <p>Bonus cat scene.</p>
        </article>
      </section>
    </main>
  </body>
</html>
